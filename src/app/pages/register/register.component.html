<section class="register-page">

  <mat-card class="register-card">

    <mat-card-header>

      <mat-card-title>
        Registrazione
      </mat-card-title>

      <mat-card-subtitle>
        Crea il tuo account BrendyStudy
      </mat-card-subtitle>

    </mat-card-header>

    <mat-card-content>

      <!-- ERRORE -->
      <div
        *ngIf="erroreMsg"
        class="errore"
      >
        {{ erroreMsg }}
      </div>

      <!-- SUCCESSO -->
      <div
        *ngIf="successoMsg"
        class="successo"
      >
        {{ successoMsg }}
      </div>

      <form
        (ngSubmit)="registra()"
      >

        <div class="form-grid">

          <mat-form-field appearance="outline">

            <mat-label>Nome</mat-label>

            <input
              matInput
              type="text"
              name="nome"
              [(ngModel)]="nome"
              required
            />

          </mat-form-field>


          <mat-form-field appearance="outline">

            <mat-label>Cognome</mat-label>

            <input
              matInput
              type="text"
              name="cognome"
              [(ngModel)]="cognome"
              required
            />

          </mat-form-field>

        </div>


        <mat-form-field
          appearance="outline"
          class="full-width"
        >

          <mat-label>Email</mat-label>

          <input
            matInput
            type="email"
            name="email"
            [(ngModel)]="email"
            required
          />

        </mat-form-field>


        <mat-form-field
          appearance="outline"
          class="full-width"
        >

          <mat-label>Username</mat-label>

          <input
            matInput
            type="text"
            name="username"
            [(ngModel)]="username"
            autocomplete="username"
            required
          />

        </mat-form-field>


        <div class="form-grid">

          <mat-form-field appearance="outline">

            <mat-label>Password</mat-label>

            <input
              matInput
              type="password"
              name="password"
              [(ngModel)]="password"
              autocomplete="new-password"
              required
            />

          </mat-form-field>


          <mat-form-field appearance="outline">

            <mat-label>Conferma password</mat-label>

            <input
              matInput
              type="password"
              name="confermaPassword"
              [(ngModel)]="confermaPassword"
              autocomplete="new-password"
              required
            />

          </mat-form-field>

        </div>


        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width"
          [disabled]="caricamento"
        >

          <span *ngIf="!caricamento">
            Registrati
          </span>

          <mat-spinner
            *ngIf="caricamento"
            diameter="24"
          >
          </mat-spinner>

        </button>

      </form>

    </mat-card-content>

  </mat-card>

</section>
