<section class="login-page">

  <mat-card class="login-card">

    <mat-card-header>
      <mat-card-title>Accedi a BrendyStudy</mat-card-title>
      <mat-card-subtitle>
        Inserisci le tue credenziali
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>

      <form (ngSubmit)="login()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>

          <input
            matInput
            type="text"
            name="username"
            [(ngModel)]="username"
            autocomplete="username"
            required
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>

          <input
            matInput
            type="password"
            name="password"
            [(ngModel)]="password"
            autocomplete="current-password"
            required
          />
        </mat-form-field>

        <div
          *ngIf="erroreMsg"
          class="errore">
          {{ erroreMsg }}
        </div>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width"
          [disabled]="caricamento">

          <span *ngIf="!caricamento">
            Accedi
          </span>

          <mat-spinner
            *ngIf="caricamento"
            diameter="24">
          </mat-spinner>

        </button>

      </form>

    </mat-card-content>

  </mat-card>

</section>
